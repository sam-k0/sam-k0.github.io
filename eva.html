<!DOCTYPE html> <html lang="en"><head>
<title>About me</title>
</head>
<body>
<div class="eva-cross">

  <div class="eva-cross__rays"></div>
  <div class="eva-cross__core"></div>
  <div class="eva-cross__sparks" aria-hidden="true">
    <span class="eva-cross__particle eva-cross__particle--left"></span>
    <span class="eva-cross__particle eva-cross__particle--right"></span>
    <span class="eva-cross__particle eva-cross__particle--top"></span>
    <span class="eva-cross__particle eva-cross__particle--bottom"></span>
  </div>
</div>


</body>
<style>
/* ============================================================
   EVANGELION-STYLE LIGHT CROSS
   Persistent / no animation
   ============================================================ */

html,
body {
  min-height: 100%;
}

body {
  display: grid;
  min-height: 100vh;
  min-height: 100svh;
  margin: 0;
  overflow: hidden;
  place-items: center;
  background:
    radial-gradient(ellipse at center, rgba(74, 16, 37, .42), transparent 58%),
    radial-gradient(ellipse at center, #1a0b12 0%, #09070a 72%);
}

.eva-cross {
  --size: min(320px, 70vmin);

  position: relative;
  width: var(--size);
  height: var(--size);

  isolation: isolate;
  overflow: visible;

  /* Helps the glow render outside the element */
  filter: saturate(1.15);
}

/* ============================================================
   HUGE ATMOSPHERIC GLOW
   ============================================================ */

.eva-cross::before {
  content: "";

  position: absolute;
  inset: -140%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255, 255, 235, 0.95) 0%,
      rgba(255, 246, 120, 0.75) 7%,
      rgba(255, 190, 25, 0.45) 18%,
      rgba(255, 100, 90, 0.25) 32%,
      rgba(255, 30, 145, 0.14) 48%,
      rgba(255, 0, 130, 0.04) 68%,
      transparent 82%
    );

  filter: blur(35px);

  opacity: .9;

  mix-blend-mode: screen;

  z-index: -5;
}


/* ============================================================
   RAY CONTAINER
   ============================================================ */

.eva-cross__rays {
  position: absolute;
  inset: -60%;

  overflow: visible;

  mix-blend-mode: screen;
}


/* ============================================================
   LONG RADIAL RAYS
   ============================================================ */

.eva-cross__rays::before {
  content: "";

  position: absolute;
  inset: 0;

  /*
   * Lots of very thin rays.
   * Most are deliberately extremely faint.
   */
  background:
    repeating-conic-gradient(
      from 0deg,

      transparent 0deg,
      transparent 0.55deg,

      rgba(255,255,235,.20) .7deg,
      rgba(255,225,80,.08) .95deg,

      transparent 1.15deg,
      transparent 2.7deg,

      rgba(255,100,170,.10) 2.9deg,
      transparent 3.25deg,

      transparent 5deg
    );

  /*
   * Hard-ish beginning, then increasingly soft disappearance.
   *
   * This prevents the rays from looking like they simply
   * fade out at a circular boundary.
   */
  mask-image:
    radial-gradient(
      ellipse at center,

      transparent 0%,
      transparent 11%,

      black 15%,
      black 22%,

      rgba(0,0,0,.85) 38%,
      rgba(0,0,0,.48) 58%,
      rgba(0,0,0,.12) 73%,

      transparent 86%
    );

  -webkit-mask-image:
    radial-gradient(
      ellipse at center,

      transparent 0%,
      transparent 11%,

      black 15%,
      black 22%,

      rgba(0,0,0,.85) 38%,
      rgba(0,0,0,.48) 58%,
      rgba(0,0,0,.12) 73%,

      transparent 86%
    );

  filter: blur(.35px);

  opacity: .9;
}


/* ============================================================
   SECONDARY FINE RAYS
   ============================================================ */

.eva-cross__rays::after {
  content: "";

  position: absolute;
  inset: -10%;

  background:
    repeating-conic-gradient(
      from 11deg,

      transparent 0deg,
      transparent 1.4deg,

      rgba(255,255,255,.28) 1.55deg,
      rgba(255,215,70,.08) 1.7deg,

      transparent 1.9deg,
      transparent 4.5deg
    );

  mask-image:
    radial-gradient(
      ellipse at center,

      transparent 12%,
      black 17%,

      rgba(0,0,0,.75) 42%,
      rgba(0,0,0,.3) 65%,

      transparent 82%
    );

  -webkit-mask-image:
    radial-gradient(
      ellipse at center,

      transparent 12%,
      black 17%,

      rgba(0,0,0,.75) 42%,
      rgba(0,0,0,.3) 65%,

      transparent 82%
    );

  filter: blur(.25px);

  opacity: .7;
}


/* ============================================================
   VERTICAL TAPERED CROSS ARM
   ============================================================ */

.eva-cross__rays {
  /*
   * We can't add another pseudo-element because both are
   * already used for the ray fields.
   *
   * The vertical arm is created with the core's box-shadow
   * layers below.
   */
}


/* ============================================================
   CORE
   ============================================================ */

.eva-cross__core {
  position: absolute;

  left: 50%;
  top: 50%;

  width: 18%;
  height: 18%;

  transform: translate(-50%, -50%);

  background:
    radial-gradient(
      ellipse at center,

      #ffffff 0%,
      #ffffff 8%,

      #fffef0 17%,
      #fff477 32%,

      #ffd01b 50%,
      #ff8b24 67%,

      rgba(255,55,150,.55) 82%,
      transparent 100%
    );

  filter:
    blur(3px)

    drop-shadow(0 0 6px #ffffff)
    drop-shadow(0 0 15px #fff27a)
    drop-shadow(0 0 30px #ffc21c)
    drop-shadow(0 0 60px #ff8125)
    drop-shadow(0 0 100px #ff329c);

  mix-blend-mode: screen;

  z-index: 5;
}

.eva-cross__sparks {
  position: absolute;
  inset: -60%;
  pointer-events: none;
  z-index: 6;
}

.eva-cross__particle {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #ffb923);
  opacity: 0;
  animation: eva-cross-particles .9s cubic-bezier(.15, .65, .3, 1) var(--delay) infinite;
}

.eva-cross__particle--left {
  left: 5%;
  top: 50%;
  box-shadow:
    5px -5px 0 rgba(255, 255, 220, .95),
    10px 2px 0 rgba(255, 220, 100, .85),
    15px -9px 0 rgba(255, 245, 190, .8),
    21px 6px 0 rgba(255, 110, 155, .7),
    27px -2px 0 rgba(255, 220, 100, .8),
    33px 10px 0 rgba(255, 255, 255, .6),
    39px -12px 0 rgba(255, 220, 100, .7),
    45px 3px 0 rgba(255, 110, 155, .55),
    52px -6px 0 rgba(255, 255, 220, .75),
    58px 12px 0 rgba(255, 220, 100, .7),
    64px -15px 0 rgba(255, 245, 190, .65),
    70px 7px 0 rgba(255, 110, 155, .5);
  --travel-x: -22px;
  --travel-y: -6px;
  --end-x: -42px;
  --end-y: -11px;
  --delay: 0s;
}

.eva-cross__particle--right {
  left: 95%;
  top: 50%;
  box-shadow:
    -5px -5px 0 rgba(255, 255, 220, .95),
    -10px 2px 0 rgba(255, 220, 100, .85),
    -15px -9px 0 rgba(255, 245, 190, .8),
    -21px 6px 0 rgba(255, 110, 155, .7),
    -27px -2px 0 rgba(255, 220, 100, .8),
    -33px 10px 0 rgba(255, 255, 255, .6),
    -39px -12px 0 rgba(255, 220, 100, .7),
    -45px 3px 0 rgba(255, 110, 155, .55),
    -52px -6px 0 rgba(255, 255, 220, .75),
    -58px 12px 0 rgba(255, 220, 100, .7),
    -64px -15px 0 rgba(255, 245, 190, .65),
    -70px 7px 0 rgba(255, 110, 155, .5);
  --travel-x: 22px;
  --travel-y: 6px;
  --end-x: 42px;
  --end-y: 11px;
  --delay: .0s;
}

.eva-cross__particle--top {
  left: 50%;
  top: 5%;
  box-shadow:
    -5px 5px 0 rgba(255, 255, 220, .95),
    2px 10px 0 rgba(255, 220, 100, .85),
    -9px 15px 0 rgba(255, 245, 190, .8),
    6px 21px 0 rgba(255, 110, 155, .7),
    -2px 27px 0 rgba(255, 220, 100, .8),
    10px 33px 0 rgba(255, 255, 255, .6),
    -12px 39px 0 rgba(255, 220, 100, .7),
    3px 45px 0 rgba(255, 110, 155, .55),
    -6px 52px 0 rgba(255, 255, 220, .75),
    12px 58px 0 rgba(255, 220, 100, .7),
    -15px 64px 0 rgba(255, 245, 190, .65),
    7px 70px 0 rgba(255, 110, 155, .5);
  --travel-x: -6px;
  --travel-y: -22px;
  --end-x: -11px;
  --end-y: -42px;
  --delay: .0s;
}

.eva-cross__particle--bottom {
  left: 50%;
  top: 95%;
  box-shadow:
    -5px -5px 0 rgba(255, 255, 220, .95),
    2px -10px 0 rgba(255, 220, 100, .85),
    -9px -15px 0 rgba(255, 245, 190, .8),
    6px -21px 0 rgba(255, 110, 155, .7),
    -2px -27px 0 rgba(255, 220, 100, .8),
    10px -33px 0 rgba(255, 255, 255, .6),
    -12px -39px 0 rgba(255, 220, 100, .7),
    3px -45px 0 rgba(255, 110, 155, .55),
    -6px -52px 0 rgba(255, 255, 220, .75),
    12px -58px 0 rgba(255, 220, 100, .7),
    -15px -64px 0 rgba(255, 245, 190, .65),
    7px -70px 0 rgba(255, 110, 155, .5);
  --travel-x: 6px;
  --travel-y: 22px;
  --end-x: 11px;
  --end-y: 42px;
  --delay: 0s;
}

@keyframes eva-cross-particles {
  0%, 1%, 31%, 32%, 62%, 63%, 93%, 100% {
    opacity: 0;
    transform: translate(0, 0) scale(.6);
  }
  4%, 35%, 66% {
    opacity: .95;
    transform: translate(0, 0) scale(1);
  }
  24%, 55%, 86% {
    opacity: .7;
    transform: translate(var(--travel-x), var(--travel-y)) scale(.9);
  }
  30%, 61%, 92% {
    opacity: 0;
    transform: translate(var(--end-x), var(--end-y)) scale(.5);
  }
}

@media (prefers-reduced-motion: reduce) {
  .eva-cross__particle {
    animation: none;
  }
}


/* ============================================================
   SHARP HORIZONTAL LIGHT
   ============================================================ */

.eva-cross__core::before {
  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 1100%;
  height: 50%;

  transform: translate(-50%, -50%);

  background:
    linear-gradient(
      90deg,

      transparent 0%,

      rgba(255,50,150,.05) 12%,
      rgba(255,130,30,.18) 25%,
      rgba(255,220,80,.55) 39%,

      #fff 48%,
      #fff 52%,

      rgba(255,220,80,.55) 61%,
      rgba(255,130,30,.18) 75%,
      rgba(255,50,150,.05) 88%,

      transparent 100%
    );

  -webkit-mask-image: linear-gradient(180deg, transparent, #000 35% 65%, transparent);
  mask-image: linear-gradient(180deg, transparent, #000 35% 65%, transparent);

  filter:
    blur(1px)
    drop-shadow(0 0 8px #fff)
    drop-shadow(0 0 20px #ffd51c)
    drop-shadow(0 0 40px #ff4b9f);

  mix-blend-mode: screen;
}


/* ============================================================
   SHARP VERTICAL LIGHT
   ============================================================ */

.eva-cross__core::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 50%;
  height: 1100%;

  transform: translate(-50%, -50%);

  background:
    linear-gradient(
      0deg,

      transparent 0%,

      rgba(255,50,150,.05) 12%,
      rgba(255,130,30,.18) 25%,
      rgba(255,220,80,.55) 39%,

      #fff 48%,
      #fff 52%,

      rgba(255,220,80,.55) 61%,
      rgba(255,130,30,.18) 75%,
      rgba(255,50,150,.05) 88%,

      transparent 100%
    );

  -webkit-mask-image: linear-gradient(90deg, transparent, #000 35% 65%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 35% 65%, transparent);

  filter:
    blur(1px)
    drop-shadow(0 0 8px #fff)
    drop-shadow(0 0 20px #ffd51c)
    drop-shadow(0 0 40px #ff4b9f);

  mix-blend-mode: screen;
}


/* ============================================================
   EXTRA POINT-LIKE RAYS
   ============================================================ */

.eva-cross::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 100%;
  height: 100%;

  transform: translate(-50%, -50%);

  background:
    repeating-conic-gradient(
      from 2deg,

      transparent 0deg,
      transparent 2.1deg,

      rgba(255,255,255,.12) 2.2deg,
      rgba(255,210,50,.04) 2.35deg,

      transparent 2.5deg,
      transparent 6deg
    );

  mask-image:
    radial-gradient(
      ellipse at center,

      transparent 0%,
      transparent 18%,

      black 25%,

      rgba(0,0,0,.5) 65%,

      transparent 100%
    );

  -webkit-mask-image:
    radial-gradient(
      ellipse at center,

      transparent 0%,
      transparent 18%,

      black 25%,

      rgba(0,0,0,.5) 65%,

      transparent 100%
    );

  filter: blur(.4px);

  mix-blend-mode: screen;

  opacity: .8;

  z-index: 3;
}


</style>
</html>
